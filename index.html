<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rømers – arkitektur, design og konsept</title>
<link rel="canonical" href="https://romers.no/">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:url" content="https://romers.no/">
<meta property="og:title" content="Rømers – arkitekt i Oslo">
<meta property="og:description" content="Tegninger til tilbygg, bruksendring, garasje og anneks, til fast pris og klare til byggesøknad.">
<meta property="og:image" content="https://romers.no/ea4d4a5714481cbf36e9f59575e10316.jpg">
<meta property="og:locale" content="nb_NO">
<meta name="description" content="Rømers er et arkitektstudio i Oslo. Tegninger til tilbygg, bruksendring, garasje og anneks, til fast pris og klare til byggesøknad.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&amp;display=swap">
<style>
body{margin:0}
a{color:var(--ink)}a:hover{color:var(--accent)}
.wrap{padding:0 clamp(16px,4vw,48px)}
.cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);column-gap:24px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px 24px}
.foot{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px 24px}
.lrow{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,3fr) minmax(0,4fr) minmax(0,1fr);gap:16px;padding:16px 0;border-top:1px solid var(--line);align-items:baseline}
.choice{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:20px;min-height:44px;border:1px solid var(--ink);background:#FFFFFF;color:var(--ink)}
.choice:hover{border-color:var(--accent)}
.choice:focus-visible,.btn:focus-visible,.link:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 28px;font-weight:600;font-size:14px;text-decoration:none}
.link{all:unset;cursor:pointer;text-decoration:underline;min-height:44px;display:inline-flex;align-items:center}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:24px}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nav a{text-decoration:none;padding:12px 0}
.nav a.btn{padding:0 22px}
@media (max-width:600px){.hbtn{display:none !important}}
@media (max-width:900px){.cols,.two{grid-template-columns:minmax(0,1fr);row-gap:32px}.foot{grid-template-columns:repeat(2,minmax(0,1fr))}.lrow{grid-template-columns:minmax(0,1fr) auto}.lrow .hide{display:none}}
</style>

</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="{{themeBg}};color:var(--ink);transition:background 0.3s;font-family:'Montserrat',Arial,sans-serif;font-weight:400;font-size:16px;line-height:1.5">

<header class="wrap" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:nowrap;gap:16px;padding-top:24px;padding-bottom:24px">
<a href="#top" onClick="{{toArk}}" style="text-decoration:none;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap">
<span style="font-weight:700;font-size:22px;letter-spacing:0.14em">RØMERS</span>
</a>
<nav class="nav" aria-label="Hovedmeny" style="display:flex;gap:28px;flex-wrap:wrap;align-items:center;font-size:15px">
<button class="tab" type="button" aria-pressed="{{arkPressed}}" onClick="{{toArk}}" style="{{arkTab}}">Arkitektur</button>
<button class="tab" type="button" aria-pressed="{{designPressed}}" onClick="{{toDesign}}" style="{{designTab}}">Design</button>
<sc-if value="{{isArk}}" hint-placeholder-val="{{true}}"><a class="btn hbtn" href="#pris" style="background:var(--ink);color:var(--paper)">Få tilbud</a></sc-if>
<sc-if value="{{isDesign}}" hint-placeholder-val="{{false}}"><a class="btn hbtn" href="#kontakt" style="background:var(--ink);color:var(--paper)">Kontakt</a></sc-if>
</nav>
</header>

<main id="top" style="display:flex;flex-direction:column;gap:96px;padding-bottom:48px">

<sc-if value="{{isArk}}" hint-placeholder-val="{{true}}">
<div style="display:flex;flex-direction:column;gap:96px">
<section aria-label="Utvalgt prosjekt" style="display:flex;flex-direction:column;gap:14px">
<img src="ea4d4a5714481cbf36e9f59575e10316.jpg" alt="Hagestue med vinterstue og overdekket terrasse foran et rekkehus i gul tegl og grønn kledning" width="1600" height="700" style="display:block;width:100%;aspect-ratio:1600/700;height:auto;object-fit:cover;background:var(--line)">
<div class="wrap row" style="flex-wrap:wrap">
<span><span style="font-weight:600">Hagestue og overdekket terrasse</span> <span style="color:var(--mute)">· Rekkehus i Danmark · bygget 2021</span></span>
<a href="#arkitektur" style="font-size:15px">Arkitektur ↓</a>
</div>
</section>

<section class="wrap cols" aria-label="Om Rømers">
<span style="font-size:13px;color:var(--mute);padding-top:10px">Rømers</span>
<p style="margin:0;font-size:clamp(26px,3.2vw,44px);line-height:1.2;font-weight:400;max-width:28ch;text-wrap:pretty">Rømers er et arkitektstudio. Jeg tegner tilbygg, bruksendringer, garasjer og hus for deg som skal bygge, med fast pris og tegninger som er klare til søknad.</p>
</section>

<section id="arkitektur" class="wrap" style="display:flex;flex-direction:column;gap:28px">
<div class="row" style="flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px">
<h2 style="margin:0;font-size:clamp(30px,3.6vw,44px);font-weight:400">Arkitektur</h2>
<span style="font-size:13px;color:var(--mute)">For deg som skal bygge</span>
</div>
<div class="two" style="align-items:start">
<div style="display:flex;flex-direction:column;gap:14px">
<h3 style="margin:0;font-size:24px;font-weight:500;line-height:1.2">Tilbygg, bruksendring, garasje, anneks eller nytt hus</h3>
<p style="margin:0;color:var(--ink2);max-width:48ch">Fra første idé og skisser i 3D til målsatte tegninger og utkast til søknad. Fortell hva du skal bygge på tre klikk, så får du et skriftlig tilbud.</p>
<p style="margin:0;font-size:14px;color:var(--ink2)">Kåre Rømer Claesson, arkitekt (Cand. Arch.)</p>
<div><a class="btn" href="#pris" style="background:var(--ink);color:var(--paper)">Kom i gang</a></div>
</div>
<div style="display:flex;flex-direction:column;gap:40px">
<sc-for list="{{archProjects}}" as="p" hint-placeholder-count="2">
<article style="display:flex;flex-direction:column;gap:8px">
<img src="{{p.img}}" alt="{{p.alt}}" width="1600" height="900" style="display:block;width:100%;height:auto;background:var(--soft);margin-bottom:6px">
<div class="row"><h3 style="margin:0;font-size:17px;font-weight:600;line-height:1.3">{{p.title}}</h3><span style="font-size:14px;color:var(--mute);white-space:nowrap">{{p.year}}</span></div>
<span style="font-size:15px">{{p.tag}}</span>
<span style="font-size:13px;color:var(--mute)">{{p.meta}} · {{p.place}}</span>
<p style="margin:4px 0 0;font-size:14px;color:var(--ink2);max-width:60ch">{{p.text}}</p>
</article>
</sc-for>
</div>
</div>
</section>

<section id="pakker" class="wrap cols" aria-label="Faste pakker">
<span style="font-size:13px;color:var(--mute);padding-top:8px">Faste pakker</span>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px">
<div style="display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:14px"><span style="font-weight:600;font-size:18px">Garasje, uthus og carport</span><span style="font-size:22px">fra 7 900 kr</span></div>
<div style="display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:14px"><span style="font-weight:600;font-size:18px">Bruksendring av kjeller, loft eller hybel</span><span style="font-size:22px">fra 14 900 kr</span></div>
<div style="display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:14px"><span style="font-weight:600;font-size:18px">Tilbygg og påbygg opptil 30 m²</span><span style="font-size:22px">fra 29 900 kr</span></div>
<p style="grid-column:1/-1;margin:0;font-style:italic;font-weight:300;color:var(--ink2);font-size:13px">Priser eks. mva. Fast pris og antall revisjonsrunder står i tilbudet. Kommunale gebyrer, ansvarlig søker, dispensasjon og rådgivere kommer i tillegg.</p>
</div>
</section>

<div class="wrap">
<section id="pris" style="background:var(--soft);padding:48px clamp(20px,4vw,48px);display:flex;flex-direction:column;gap:28px">
<div class="row" style="flex-wrap:wrap">
<h2 style="margin:0;font-size:clamp(26px,3vw,36px);font-weight:400;line-height:1.15">{{stepTitle}}</h2>
<span style="font-weight:700;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent)">{{stepLabel}}</span>
</div>

<sc-if value="{{isStep1}}" hint-placeholder-val="{{true}}">
<div style="display:flex;flex-direction:column;gap:20px">
<p style="margin:0;color:var(--ink2)">Velg én eller flere faser.</p>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px">
<sc-for list="{{phases}}" as="ph" hint-placeholder-count="4">
<button class="choice" type="button" aria-pressed="{{ph.pressed}}" onClick="{{ph.toggle}}" style="{{ph.style}}">
<span style="display:flex;justify-content:space-between;align-items:center;gap:12px">
<span style="font-weight:700;font-size:13px">{{ph.n}}</span>
<span aria-hidden="true" style="{{ph.boxStyle}}">{{ph.mark}}</span>
</span>
<span style="font-size:19px;font-weight:700;line-height:1.2">{{ph.title}}</span>
<span style="{{ph.subStyle}}">{{ph.sub}}</span>
</button>
</sc-for>
</div>
<div><button class="btn" type="button" onClick="{{toStep2}}" style="{{nextStyle}}">Neste</button></div>
</div>
</sc-if>

<sc-if value="{{isStep2}}" hint-placeholder-val="{{false}}">
<div style="display:flex;flex-direction:column;gap:20px">
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px">
<sc-for list="{{types}}" as="ty" hint-placeholder-count="6">
<button class="choice" type="button" onClick="{{ty.pick}}">
<span style="font-size:19px;font-weight:700;line-height:1.2">{{ty.name}}</span>
<span style="font-style:italic;font-weight:300;color:var(--ink2);font-size:14px">{{ty.sub}}</span>
</button>
</sc-for>
</div>
<div><button class="link" type="button" onClick="{{back}}">← Tilbake</button></div>
</div>
</sc-if>

<sc-if value="{{isStep3}}" hint-placeholder-val="{{false}}">
<div style="display:flex;flex-direction:column;gap:20px">
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px">
<sc-for list="{{sizes}}" as="sz" hint-placeholder-count="3">
<button class="choice" type="button" onClick="{{sz.pick}}">
<span style="font-size:19px;font-weight:700;line-height:1.2">{{sz.label}}</span>
</button>
</sc-for>
</div>
<div><button class="link" type="button" onClick="{{back}}">← Tilbake</button></div>
</div>
</sc-if>

<sc-if value="{{isResult}}" hint-placeholder-val="{{false}}">
<div style="display:flex;flex-direction:column;gap:20px">
<p style="margin:0;color:var(--ink2)">{{summaryLine}}</p>
<sc-if value="{{canOnline}}" hint-placeholder-val="{{false}}">
<button class="choice" type="button" aria-pressed="{{onlinePressed}}" onClick="{{toggleOnline}}" style="{{onlineStyle}}">
<span style="display:flex;justify-content:space-between;align-items:center;gap:12px">
<span style="font-size:17px;font-weight:700;line-height:1.25">{{onlineTitle}}</span>
<span aria-hidden="true" style="{{onlineBox}}">{{onlineMark}}</span>
</span>
<span style="{{onlineSubStyle}}">{{onlineSub}}</span>
</button>
</sc-if>
<div style="background:#FFFFFF;padding:24px;display:flex;flex-direction:column;gap:0">
<sc-for list="{{lines}}" as="ln" hint-placeholder-count="3">
<div style="display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:14px 0;border-bottom:1px solid #EEF0EC;flex-wrap:wrap">
<div style="display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 260px">
<span style="font-weight:700">{{ln.title}}</span>
<span style="font-style:italic;font-weight:300;color:var(--ink2);font-size:14px">{{ln.what}}</span>
</div>
<sc-if value="{{showPrices}}" hint-placeholder-val="{{false}}"><span style="white-space:nowrap;display:inline-flex;gap:10px;align-items:baseline"><span style="text-decoration:line-through;color:var(--ink2);font-weight:300">{{ln.old}}</span><span style="font-weight:700">{{ln.price}}</span></span></sc-if>
</div>
</sc-for>
<sc-if value="{{showPrices}}" hint-placeholder-val="{{false}}">
<div style="display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding-top:18px;flex-wrap:wrap">
<span style="font-weight:700;font-size:18px">{{totalLabel}}</span>
<span style="font-weight:700;font-size:24px">{{total}}</span>
</div>
</sc-if>
</div>
<sc-if value="{{hasHourNote}}" hint-placeholder-val="{{false}}">
<p style="margin:0;font-size:14px">{{hourNote}}</p>
</sc-if>
<sc-if value="{{hasNote}}" hint-placeholder-val="{{false}}">
<p style="margin:0;font-size:14px">{{note}}</p>
</sc-if>
<p style="margin:0;font-style:italic;font-weight:300;color:var(--ink2);font-size:13px;max-width:75ch">Du får et skriftlig tilbud med omfang, pris og antall revisjonsrunder før jeg starter. Kommunale gebyrer, dispensasjon og rådgivere kommer i tillegg. Du får svar innen én virkedag.</p>
<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">
<a class="btn" href="{{mailto}}" style="background:var(--ink);color:var(--paper)">Be om tilbud</a>
<button class="link" type="button" onClick="{{restart}}">Start på nytt</button>
</div>
</div>
</sc-if>
</section>
</div>

<section id="slik" class="wrap cols" aria-label="Slik jobber jeg">
<span style="font-size:13px;color:var(--mute);padding-top:8px">Slik jobber jeg</span>
<ol style="margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px">
<li style="display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px"><span style="font-weight:700;font-size:13px;color:var(--accent)">01</span><span style="font-weight:600;font-size:18px">Kort samtale</span><span style="color:var(--ink2);font-size:15px">Du forteller hva du vil bygge, på telefon eller video. 15 minutter, uten kostnad.</span></li>
<li style="display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px"><span style="font-weight:700;font-size:13px;color:var(--accent)">02</span><span style="font-weight:600;font-size:18px">Skriftlig tilbud</span><span style="color:var(--ink2);font-size:15px">Omfang, pris og antall revisjonsrunder står i tilbudet før jeg starter.</span></li>
<li style="display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px"><span style="font-weight:700;font-size:13px;color:var(--accent)">03</span><span style="font-weight:600;font-size:18px">Skisser og tegninger</span><span style="color:var(--ink2);font-size:15px">Alternativer i 3D, deretter målsatte tegninger. Hver tegning sjekkes mot kommunens krav før du får den.</span></li>
<li style="display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px"><span style="font-weight:700;font-size:13px;color:var(--accent)">04</span><span style="font-weight:600;font-size:18px">Klar til søknad</span><span style="color:var(--ink2);font-size:15px">Du får tegningssettet og utkast til søknad og nabovarsel, klart til å sende.</span></li>
</ol>
</section>


</div>
</sc-if>

<sc-if value="{{isDesign}}" hint-placeholder-val="{{false}}">
<div style="display:flex;flex-direction:column;gap:96px">
<section aria-label="Utvalgt designprosjekt" style="display:flex;flex-direction:column;gap:14px">
<img src="defc19c4db37306c35ccb6caf4e90dd7.jpg" alt="Gårdsrom omkranset av trappede bygg kledd med plater med runde og avrundet firkantede åpninger" width="1600" height="700" style="display:block;width:100%;aspect-ratio:1600/700;height:auto;object-fit:cover;background:var(--line)">
<div class="wrap row" style="flex-wrap:wrap">
<span><span style="font-weight:600">Solstyrt fasade</span> <span style="color:var(--mute)">· Parametrisk studie, Oslo · 2026</span></span>
</div>
</section>
<section class="wrap cols" aria-label="Design og konsept hos Rømers">
<span style="font-size:13px;color:var(--mute);padding-top:10px">Design og konsept</span>
<p style="margin:0;font-size:clamp(26px,3.2vw,44px);line-height:1.2;font-weight:400;max-width:28ch;text-wrap:pretty">For bedrifter lager jeg rom, events og merkevarer som forteller en historie, gjerne med naturen og parametrisk form som verktøy.</p>
</section>

<section id="konsept" class="wrap" style="display:flex;flex-direction:column;gap:28px">
<div class="row" style="flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px">
<h2 style="margin:0;font-size:clamp(26px,3vw,36px);font-weight:400">Design og konsept</h2>
<span style="font-size:13px;color:var(--mute)">For bedrifter</span>
</div>
<div class="two" style="align-items:start">
<div style="display:flex;flex-direction:column">
<div class="row" style="border-top:1px solid var(--line);padding:12px 0;align-items:flex-start;flex-wrap:wrap"><span style="font-weight:600;min-width:12ch">Rom</span><span style="color:var(--ink2);flex:1 1 260px;font-size:15px">Visningssentre, showrooms, butikker og utstillinger, fra romforløp til tegninger produksjonen kan bygge etter.</span></div>
<div class="row" style="border-top:1px solid var(--line);padding:12px 0;align-items:flex-start;flex-wrap:wrap"><span style="font-weight:600;min-width:12ch">Events</span><span style="color:var(--ink2);flex:1 1 260px;font-size:15px">Konsepter for events, lanseringer og opplevelser, med historien og rommet som utgangspunkt.</span></div>
<div class="row" style="border-top:1px solid var(--line);padding:12px 0;align-items:flex-start;flex-wrap:wrap"><span style="font-weight:600;min-width:12ch">Merkevare</span><span style="color:var(--ink2);flex:1 1 260px;font-size:15px">Idé, historie og uttrykk for en merkevare, et produkt eller en kampanje.</span></div>
<div class="row" style="border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0;align-items:flex-start;flex-wrap:wrap"><span style="font-weight:600;min-width:12ch">Visualisering</span><span style="color:var(--ink2);flex:1 1 260px;font-size:15px">3D, parametrisk form og presentasjoner som får en idé forstått og godkjent.</span></div>
<div style="padding-top:20px;display:flex;gap:12px;flex-wrap:wrap;align-items:center"><a class="btn" href="mailto:post@romers.no?subject=Konsept%20og%20design" style="border:1px solid var(--ink);color:var(--ink)">Fortell meg hva du jobber med</a><a href="/tekno/" style="color:var(--ink);font-size:15px;min-height:44px;display:inline-flex;align-items:center">Tekno – designstudioet →</a></div>
</div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:32px 20px">
<sc-for list="{{designProjects}}" as="p" hint-placeholder-count="6">
<article style="display:flex;flex-direction:column;gap:6px">
<img src="{{p.img}}" alt="{{p.alt}}" width="1600" height="900" style="display:block;width:100%;aspect-ratio:4/3;height:auto;object-fit:cover;background:var(--soft);margin-bottom:4px">
<h3 style="margin:0;font-size:16px;font-weight:600;line-height:1.3">{{p.title}}</h3>
<span style="font-size:13px;color:var(--mute)">{{p.meta}}</span>
<p class="clamp" style="margin:0;font-size:14px;color:var(--ink2)">{{p.tag}}</p>
</article>
</sc-for>
</div>
</div>
</section>

<section id="research" class="wrap" style="display:flex;flex-direction:column;gap:20px">
<div class="row" style="flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px">
<h2 style="margin:0;font-size:clamp(22px,2.4vw,28px);font-weight:400">Research</h2>
<span style="font-size:13px;color:var(--mute)">Studieprosjekter og forsøk</span>
</div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:24px 16px">
<sc-for list="{{researchProjects}}" as="p" hint-placeholder-count="5">
<article style="display:flex;flex-direction:column;gap:4px">
<img src="{{p.img}}" alt="{{p.alt}}" width="1600" height="900" style="display:block;width:100%;aspect-ratio:4/3;height:auto;object-fit:cover;background:var(--soft);margin-bottom:4px">
<span style="font-size:15px;font-weight:600;line-height:1.3">{{p.title}}</span>
<span style="font-size:13px;color:var(--mute)">{{p.place}}</span>
</article>
</sc-for>
</div>
</section>

</div>
</sc-if>

<section id="om" class="wrap cols" style="row-gap:32px">
<span style="font-size:13px;color:var(--mute);padding-top:8px">Om</span>
<div class="two" style="align-items:start">
<img src="9c03e08499f8e372d57e62dc078cf238.jpg" alt="Portrett av arkitekt Kåre Rømer Claesson" width="880" height="1100" style="display:block;aspect-ratio:4/5;width:100%;max-width:360px;height:auto;object-fit:cover;background:#33443D">

back: () => this.setState({ step: s.step === 3 ? 2 : 1 }),
restart: () => this.setState({ step: 1, picked: {}, typeId: null, sizeIdx: null, online: false }),
mailto: 'mailto:post@romers.no?subject=' + encodeURIComponent('Forespørsel: ' + (t ? t.name : 'byggeprosjekt')) + '&body=' + encodeURIComponent(body)
};
}
}

(function(){
  const app = document.getElementById('app');
  const tpl = document.getElementById('tpl').content;
  const comp = new Component({});
  const get = (path, scope) => path.trim().split('.').reduce((o, k) => o == null ? undefined : o[k], scope);
  const one = /^\{\{([^{}]+)\}\}$/;
  function val(str, scope){
    const m = str.match(one);
    if (m) return get(m[1], scope);
    return str.replace(/\{\{([^{}]+)\}\}/g, (_, p) => { const v = get(p, scope); return v == null ? '' : String(v); });
  }
  function proc(node, scope, parent){
    if (node.nodeType === 3) { parent.appendChild(document.createTextNode(val(node.nodeValue, scope))); return; }
    if (node.nodeType !== 1) return;
    const tag = node.tagName.toLowerCase();
    if (tag === 'sc-if') { if (val(node.getAttribute('value') || '', scope)) node.childNodes.forEach(c => proc(c, scope, parent)); return; }
    if (tag === 'sc-for') {
      const list = val(node.getAttribute('list') || '', scope) || [];
      const as = node.getAttribute('as') || 'item';
      list.forEach(item => { const sc = Object.assign({}, scope, { [as]: item }); node.childNodes.forEach(c => proc(c, sc, parent)); });
      return;
    }
    const el = node.namespaceURI === 'http://www.w3.org/2000/svg' ? document.createElementNS(node.namespaceURI, node.tagName) : document.createElement(tag);
    for (const a of node.attributes) {
      if (a.name.startsWith('hint-')) continue;
      if (a.name.startsWith('on')) { const fn = val(a.value, scope); if (typeof fn === 'function') el.addEventListener(a.name.slice(2), fn); continue; }
      const v = val(a.value, scope); if (v === undefined || v === null || v === false) continue;
      el.setAttribute(a.name, v);
    }
    node.childNodes.forEach(c => proc(c, scope, el));
    parent.appendChild(el);
  }
  let pending = false;
  window.scheduleRender = function(){ if (pending) return; pending = true; requestAnimationFrame(render); };
  function render(){
    pending = false;
    const scope = comp.renderVals();
    const frag = document.createDocumentFragment();
    tpl.childNodes.forEach(c => proc(c, scope, frag));
    app.replaceChildren(frag);
  }
  render();
  const h = location.hash;
  if (h && h.length > 1 && !/^#(design|top)$/.test(h)) { const t = document.getElementById(h.slice(1)); if (t) t.scrollIntoView(); }
})();

</script>
